[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-agent"
version = "0.1.0"
description = "Tool-using agent that books meetings from plain-English requests."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # ZoneInfo needs a timezone database. Linux/macOS ship one with the OS;
    # Windows does not, so pull the IANA data as a package there.
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]

[tool.setuptools]
py-modules = ["agent", "calendar_store", "seed_calendar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
